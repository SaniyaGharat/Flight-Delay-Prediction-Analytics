# Flight Delay Prediction and Analytics Configuration

app:
  name: "FlightDelayPredictionAndAnalytics"
  environment: "development"

spark:
  master: "local[*]"
  driver_memory: "4g"
  executor_memory: "4g"
  shuffle_partitions: 8
  default_fs: "hdfs://localhost:9000"

hdfs:
  namenode_uri: "hdfs://localhost:9000"
  replication: 1
  base_dir: "/user/saniya/flight_delay"
  paths:
    base: "/user/saniya/flight_delay"
    raw: "/user/saniya/flight_delay/raw"
    processed: "/user/saniya/flight_delay/processed"
    export: "/user/saniya/flight_delay/export"
    smoke_test: "/user/saniya/flight_delay/tmp_smoke_test"
    flights_subfolder: "/user/saniya/flight_delay/raw/flights"
    airports_subfolder: "/user/saniya/flight_delay/raw/airports"
    airlines_subfolder: "/user/saniya/flight_delay/raw/airlines"
    flights: "/user/saniya/flight_delay/raw/flights/flights.csv"
    airports: "/user/saniya/flight_delay/raw/airports/airports.csv"
    airlines: "/user/saniya/flight_delay/raw/airlines/airlines.csv"

raw_data:
  local_dir: "data/raw"
  files:
    flights: "flights.csv"
    airports: "airports.csv"
    airlines: "airlines.csv"

local_paths:
  raw_data: "data/raw"
  output_powerbi: "output/powerbi"
  logs: "logs"
